name: Build Application

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  validate-master-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require develop branch for master PRs
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$BASE_REF" = "master" ] && { [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; }; then
            echo "::error::PRs into master must come from the develop branch in this repository."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'yarn'

      # Same setup as packages/security-server/Dockerfile.production: compile @u4/opencv4nodejs
      # against the apt-installed OpenCV instead of letting it auto-build OpenCV from source
      - name: Install OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopencv-dev

      - run: yarn install --frozen-lockfile
        env:
          OPENCV4NODEJS_DISABLE_AUTOBUILD: 1
          OPENCV_INCLUDE_DIR: /usr/include/opencv4
          OPENCV_LIB_DIR: /usr/lib/x86_64-linux-gnu

      - run: yarn nx format:check
      - run: yarn nx run-many -t lint build typecheck
