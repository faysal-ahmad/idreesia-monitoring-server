services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: idreesia
      POSTGRES_USER: idreesia
      POSTGRES_PASSWORD: idreesia
    volumes:
      - postgres-dev:/var/lib/postgresql:cached
      - ./configs/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idreesia"]
      interval: 5s
      timeout: 5s
      retries: 20

  security-server:
    build:
      context: .
      dockerfile: ./packages/security-server/Dockerfile.development
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    env_file: ./packages/security-server/.env
    volumes:
      - .:/app
      # Alert frame images (see ALERT_IMAGES_DIR), kept out of Postgres.
      - alert-images:/data/alert-images

  security-server-ui:
    build:
      context: .
      dockerfile: ./packages/security-server-ui/Dockerfile.development
    depends_on:
      - security-server
    ports:
      - "4200:4200"
    volumes:
      - .:/app
    healthcheck:
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres-dev: {}
  alert-images: {}
