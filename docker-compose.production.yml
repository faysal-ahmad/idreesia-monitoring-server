services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: idreesia
      POSTGRES_USER: idreesia
      POSTGRES_PASSWORD: idreesia
    volumes:
      - ${POSTGRES_DATA_HOST_DIR:-/data/postgres/data}:/var/lib/postgresql:cached
      - ./configs/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idreesia"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Media server: the only client of each camera. The security server registers one stream per
  # enabled channel through its API and reads the re-streams; browsers watch them via the UI proxy.
  # Settings are passed inline; /config/go2rtc.yaml is go2rtc's own writable file inside this
  # container (where it saves API-added streams) — deliberately not in the repo, since stream
  # sources carry camera credentials. The DB stays the source of truth (see MediaServerService).
  go2rtc:
    image: alexxit/go2rtc:1.9.14
    restart: unless-stopped
    command:
      - go2rtc
      - -config
      - /config/go2rtc.yaml
      - -config
      - '{"api":{"listen":":1984"},"rtsp":{"listen":":8554"},"webrtc":{"listen":""}}'
    # No published ports: only the security server and the UI's nginx (same network) reach it.

  security-server:
    build:
      context: .
      dockerfile: ./packages/security-server/Dockerfile.production
    depends_on:
      postgres:
        condition: service_healthy
      go2rtc:
        condition: service_started
    restart: unless-stopped
    environment:
      # sslmode=disable: the postgres container has no TLS at all, and Prisma's query engine still
      # attempts (and fails) a TLS handshake against bookworm's OpenSSL 3 unless told not to.
      DATABASE_URL: "postgresql://idreesia:idreesia@postgres:5432/idreesia?schema=security_server&sslmode=disable"
      # Read RTSP over TCP in OpenCV's FFmpeg backend — over UDP, lost RTP packets make reads
      # silently return empty frames.
      OPENCV_FFMPEG_CAPTURE_OPTIONS: "rtsp_transport;tcp"
      # Password for the admin pages (everything except Alerts). Change it before deploying.
      ADMIN_PASSWORD: change-me
      # The ERP, which owns channels and profiles and receives alerts, and the ERP service account
      # (holding only the "Sync Security Server Data" permission) this server logs in as.
      ERP_URL: https://erp.example.org
      ERP_USERNAME: security-server
      ERP_PASSWORD: change-me
    volumes:
      # Alert frame images (see ALERT_IMAGES_DIR) on a folder on the host machine. The server runs as
      # UID 1001 (see Dockerfile.production), so that folder must be writable by UID 1001.
      - ${ALERT_IMAGES_HOST_DIR:-/data/alert-images}:/data/alert-images

  security-server-ui:
    build:
      context: .
      dockerfile: ./packages/security-server-ui/Dockerfile.production
    depends_on:
      - security-server
    ports:
      - "80:4200"
    restart: unless-stopped

volumes:
  postgres-data: {}
