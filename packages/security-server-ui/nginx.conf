server {
  listen 4200;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://security-server:3000/api/;
    proxy_set_header Host $host;
  }

  # Live video via go2rtc. Only its player scripts and WebSocket stream endpoint are exposed — its
  # REST API is unauthenticated and lists camera credentials, so every other /go2rtc/ path is 404.
  location = /go2rtc/video-stream.js {
    proxy_pass http://go2rtc:1984/video-stream.js;
  }

  location = /go2rtc/video-rtc.js {
    proxy_pass http://go2rtc:1984/video-rtc.js;
  }

  location = /go2rtc/api/ws {
    proxy_pass http://go2rtc:1984/api/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /go2rtc/ {
    return 404;
  }

  # Server-Sent Events feed for the Alerts page: a long-lived streaming response, so no
  # buffering, HTTP/1.1 keep-alive to the upstream, and a read timeout well past the server's
  # 30s heartbeat.
  location /api/alerts/stream {
    proxy_pass http://security-server:3000/api/alerts/stream;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
}
